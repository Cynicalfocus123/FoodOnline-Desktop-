<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">FoodOnlines hero poster</title>
  <desc id="desc">Branded fallback poster for the FoodOnlines homepage hero video.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101816" />
      <stop offset="45%" stop-color="#163025" />
      <stop offset="100%" stop-color="#2d1b12" />
    </linearGradient>
    <radialGradient id="glowLeft" cx="30%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#95c11f" stop-opacity=".55" />
      <stop offset="100%" stop-color="#95c11f" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowRight" cx="70%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ff6b00" stop-opacity=".42" />
      <stop offset="100%" stop-color="#ff6b00" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)" />
  <rect width="1600" height="900" fill="url(#glowLeft)" />
  <rect width="1600" height="900" fill="url(#glowRight)" />

